[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entrymap"
version = "0.1.0"
description = "Scan Python source trees and map package entry points from pyproject.toml"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["python", "cli", "entrypoints", "pyproject", "developer-tools"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.15"]

[project.scripts]
entrymap = "entrymap.cli:main"

[project.entry-points."entrymap.cli"]
entrymap = "entrymap.cli:main"

[project.urls]
Repository = "https://github.com/noahalexandercampbell/entrymap"

[tool.setuptools.packages.find]
where = ["."]
include = ["entrymap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
